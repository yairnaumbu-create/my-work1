name: NAUMBOT Runner

on:
  schedule:
    # 24/7. Trading logic itself only opens positions during US market hours.
    - cron: '2-59/6 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/naumbot-runner.yml'

concurrency:
  group: naumbot-paper-runner
  cancel-in-progress: false

jobs:
  run-naumbot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake NAUMBOT paper-trading engine
        shell: bash
        run: |
          set -euo pipefail
          URL="https://naumbot-v3-yrnambu-5971s-projects.vercel.app/api/cron?source=github-runner"
          echo "Calling NAUMBOT at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if ! curl --fail --silent --show-error --max-time 70 \
            -H 'User-Agent: naumbot-github-runner' "$URL"; then
            echo "First call failed; retrying once after 35 seconds"
            sleep 35
            curl --fail --silent --show-error --max-time 70 \
              -H 'User-Agent: naumbot-github-runner-retry' "$URL"
          fi
          echo
          echo "NAUMBOT cycle completed"
